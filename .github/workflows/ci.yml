name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  frontend-test:
    name: frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  coverage:
    name: coverage (rust + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Rust coverage (fails under 80% lines)
        # src-tauri/src/{main,lib}.rs são puro bootstrap do Tauri (builder + entrypoint),
        # sem lógica de negócio nesta tarefa — ver docs/qa/cobertura.md.
        run: |
          cargo llvm-cov --workspace --fail-under-lines 80 \
            --ignore-filename-regex '(^|/)src-tauri/src/(main|lib)\.rs$'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend coverage (thresholds enforced by vitest config)
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

  build-windows:
    name: build (windows, no bundle)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: tauri build --no-bundle (roda beforeBuildCommand + cargo build --release)
        run: frontend/node_modules/.bin/tauri build --no-bundle

  e2e:
    name: e2e (binário Tauri real + matriz de layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tauri-driver (Tauri 2)
        run: cargo install tauri-driver --version 2.0.5
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build Tauri app (release, no bundle) — o binário real que o e2e dirige
        run: frontend/node_modules/.bin/tauri build --no-bundle
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      # Fluxo completo, 26 controles e i18n contra o binário Tauri real (R2: não
      # um atalho que pula o shell). WebKitWebDriver vem do webkit2gtk-driver, no PATH.
      - name: WebdriverIO (binário real, sob Xvfb)
        working-directory: e2e
        env:
          TAURI_APP_PATH: ../target/release/placar-bjj-desktop
        run: xvfb-run -a npm test
      # P8: matriz de layout no Chromium (motor do WebView2, alvo no Windows).
      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Matriz de layout (Playwright)
        working-directory: e2e
        run: npm run test:layout
